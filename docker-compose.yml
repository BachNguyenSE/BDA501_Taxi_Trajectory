name: bda501-taxi

services:
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: bda501-taxi-spark:1.0
    container_name: bda501-spark
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark UI (driver)
    environment:
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-5g}
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      - mongo

  mongo:
    image: mongo:8.0.15
    container_name: bda501-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    image: bda501-taxi-spark:1.0
    container_name: bda501-api
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    command: ["uvicorn", "src.serving.api:app", "--host", "0.0.0.0", "--port", "8000"]

  # Started only for the streaming part:  docker compose --profile streaming up -d
  kafka:
    image: apache/kafka:3.9.1
    container_name: bda501-kafka
    profiles: ["streaming"]
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly by src/streaming/producer.py

  # Hadoop 3.5.0 HDFS + YARN for the MapReduce step (same image/config as the course lab).
  # Started only for MapReduce:  docker compose --profile hadoop up -d
  namenode:
    &hadoop
    build:
      context: docker/hadoop
    image: bda501-hadoop-lab:3.5.0
    container_name: bda501-taxi-namenode
    hostname: namenode
    profiles: ["hadoop"]
    env_file: ./docker/hadoop/hadoop.env
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /data/name/current
    ports:
      - "9870:9870"   # HDFS UI
    volumes:
      - namenode-data:/data/name

  datanode:
    <<: *hadoop
    container_name: bda501-taxi-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    environment:
      WAITFOR: namenode:8020
    ports:
      - "9864:9864"
    volumes:
      - datanode-data:/data/data

  resourcemanager:
    <<: *hadoop
    container_name: bda501-taxi-resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    environment:
      WAITFOR: namenode:8020
    ports:
      - "8088:8088"   # YARN UI
    volumes: []

  nodemanager:
    <<: *hadoop
    container_name: bda501-taxi-nodemanager
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    environment:
      WAITFOR: resourcemanager:8088
    ports:
      - "8042:8042"
    volumes: []

  historyserver:
    <<: *hadoop
    container_name: bda501-taxi-historyserver
    hostname: historyserver
    command: ["mapred", "historyserver"]
    environment:
      WAITFOR: namenode:8020
    ports:
      - "19888:19888"
    volumes: []

  hadoop-client:
    <<: *hadoop
    container_name: bda501-taxi-hadoop-client
    hostname: hadoop-client
    command: ["sleep", "infinity"]
    environment:
      WAITFOR: namenode:8020
    ports: []
    working_dir: /workspace
    volumes:
      - ./:/workspace

volumes:
  mongo-data:
  namenode-data:
  datanode-data:
